<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendarización 2026 · MÁS Educación Continua UNIACC</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Elizeth';
    src: local('Elizeth');
    font-weight: 400;
  }

  :root {
    --bg: #FFFFFF;
    --surface: #F7F7F8;
    --surface-hover: #F0F0F2;
    --border: #E8E8EB;
    --border-light: #F0F0F2;
    --text: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-muted: #8A8A8A;
    --negro: #1A1A1A;
    --rosa: #E91E8C;
    --celeste: #5BBEF5;
    --naranjo: #F37021;
    --blanco: #FFFFFF;
    --diplomado: #1A1A1A;
    --curso: #5BBEF5;
    --taller: #F37021;
    --pasantia: #E91E8C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    max-width: 1320px;
    margin: 0 auto;
  }
  .logo-wrap img {
    height: 36px;
    width: auto;
  }
  .header-right {
    text-align: right;
  }
  .header-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .brand-bar {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
    margin-top: 6px;
  }
  .brand-bar span {
    width: 24px;
    height: 3px;
    border-radius: 2px;
  }
  .b-rosa { background: var(--rosa); }
  .b-celeste { background: var(--celeste); }
  .b-naranjo { background: var(--naranjo); }

  /* ── HERO ── */
  .hero {
    max-width: 1320px;
    margin: 0 auto;
    padding: 56px 32px 40px;
  }
  .hero-upper {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--rosa);
    margin-bottom: 12px;
  }
  .hero h1 {
    font-family: 'Elizeth', 'Georgia', serif;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--negro);
    margin-bottom: 12px;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--rosa);
  }
  .hero p {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 520px;
    line-height: 1.65;
    font-weight: 400;
  }
  .hero-divider {
    display: flex;
    gap: 4px;
    margin-top: 28px;
  }
  .hero-divider span {
    height: 3px;
    width: 32px;
    border-radius: 2px;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 32px 32px;
  }
  .stat-num {
    font-family: 'Elizeth', 'Georgia', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--negro);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ── FILTERS ── */
  .filters-wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 32px 28px;
  }
  .search-wrap {
    position: relative;
    max-width: 380px;
    margin-bottom: 20px;
  }
  .search-wrap input {
    width: 100%;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 400;
    padding: 11px 16px 11px 42px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus {
    border-color: var(--celeste);
    box-shadow: 0 0 0 3px rgba(91,190,245,0.12);
  }
  .search-wrap input::placeholder { color: var(--text-muted); }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    align-items: center;
  }
  .filter-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    min-width: 68px;
    padding-top: 1px;
  }
  .filter-btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    border-color: #CCC;
    color: var(--text);
    background: var(--surface);
  }
  .filter-btn.active {
    background: var(--negro);
    border-color: var(--negro);
    color: #fff;
  }
  .filter-btn.active-tipo[data-tipo="Diplomado"] { background: var(--negro); border-color: var(--negro); color: #fff; }
  .filter-btn.active-tipo[data-tipo="Curso"] { background: var(--celeste); border-color: var(--celeste); color: #fff; }
  .filter-btn.active-tipo[data-tipo="Taller"] { background: var(--naranjo); border-color: var(--naranjo); color: #fff; }
  .filter-btn.active-tipo[data-tipo="Pasantía"] { background: var(--rosa); border-color: var(--rosa); color: #fff; }

  /* ── CALENDAR ── */
  .calendar {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 32px 80px;
  }
  .month-section {
    margin-bottom: 48px;
    animation: fadeUp 0.45s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .month-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--negro);
  }
  .month-name {
    font-family: 'Elizeth', 'Georgia', serif;
    font-size: clamp(1.5rem, 2.8vw, 2rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--negro);
  }
  .month-year {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }
  .month-count {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface);
    padding: 4px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
  }

  /* ── PROGRAM CARDS ── */
  .programs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
  }
  @media (max-width: 480px) {
    .programs-grid { grid-template-columns: 1fr; }
  }
  .program-card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: all 0.2s ease;
    cursor: default;
  }
  .program-card:hover {
    background: var(--surface-hover);
    border-color: var(--border);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .card-accent {
    width: 3px;
    min-height: 100%;
    border-radius: 3px;
    flex-shrink: 0;
    align-self: stretch;
  }
  .card-accent.diplomado { background: var(--negro); }
  .card-accent.curso { background: var(--celeste); }
  .card-accent.taller { background: var(--naranjo); }
  .card-accent.pasantia { background: var(--rosa); }
  .card-body { flex: 1; min-width: 0; }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .card-tipo {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 3px;
  }
  .card-tipo.diplomado { background: rgba(26,26,26,0.08); color: var(--negro); }
  .card-tipo.curso { background: rgba(91,190,245,0.12); color: #2A8BD4; }
  .card-tipo.taller { background: rgba(243,112,33,0.1); color: var(--naranjo); }
  .card-tipo.pasantia { background: rgba(233,30,140,0.1); color: var(--rosa); }
  .card-date {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 6px;
    color: var(--text);
  }
  .card-fac {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fac-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── SIN FECHA ── */
  .no-date-section {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px dashed var(--border);
  }
  .no-date-header {
    font-family: 'Elizeth', 'Georgia', serif;
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
  .empty-state p { font-size: 14px; }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 32px 32px;
    border-top: 1px solid var(--border);
  }
  .footer-bars {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-bottom: 12px;
  }
  .footer-bars span { width: 20px; height: 3px; border-radius: 2px; }
  .footer-text {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── SCROLL TOP ── */
  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--negro);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(16px);
    transition: all 0.3s;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .scroll-top.visible { opacity: 1; transform: translateY(0); }
  .scroll-top:hover { background: var(--rosa); }

  @media (max-width: 640px) {
    .site-header { padding: 16px 20px; }
    .hero { padding: 36px 20px 28px; }
    .stats-bar { padding: 0 20px 24px; gap: 24px; }
    .filters-wrap { padding: 0 20px 20px; }
    .calendar { padding: 0 20px 60px; }
    .filter-label { min-width: 54px; font-size: 9px; }
    .logo-wrap img { height: 28px; }
  }
</style>
</head>

"},{"n":"Curso: Interiorismo Comercial y Mobiliario de Exhibición","f":"Arquitectura y Diseño","s":"Curso","d":"28/10/2026"},{"n":"Curso de Mezcla Musical Avanzada: técnica, criterio y creatividad","f":"Artes","s":"Curso","d":"13/07/2026"},{"n":"Curso Producción y Síntesis de Audio en Ableton Live","f":"Artes","s":"Curso","d":"23/07/2026"},{"n":"Curso Ley de Responsabilidad Parental y Pago Efectivo de Alimentos (Ley 21.484)","f":"Ciencias Jurídicas y Sociales","s":"Curso","d":"05/08/2026"},{"n":"Curso en Registro Nacional de Deudores de Pensiones de Alimentos","f":"Ciencias Jurídicas y Sociales","s":"Curso","d":"10/08/2026"},{"n":"Curso Arte Contemporáneo y Bienales Internacionales","f":"Artes","s":"Curso","d":"05/10/2026"}];

const MONTH_NAMES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FAC_COLORS = {
  'Ciencias Jurídicas y Sociales': '#1A1A1A',
  'Artes': '#E91E8C',
  'Comunicaciones': '#F37021',
  'Psicología': '#5BBEF5',
  'Negocios y Tecnología': '#2A6BAC',
  'Diversidad, Género e Inclusión': '#9B59B6',
  'Arquitectura y Diseño': '#E74C3C'
};

function parseDate(d) {
  if (!d) return null;
  const [day, month, year] = d.split('/');
  return { day: parseInt(day), month: parseInt(month), year: parseInt(year) };
}
function formatDate(d) {
  if (!d) return 'Por confirmar';
  const p = parseDate(d);
  return `${p.day} de ${MONTH_NAMES[p.month].toLowerCase()}`;
}

let activeTipo = null, activeFac = null, activeMonth = null, searchTerm = '';
const tipos = [...new Set(DATA.filter(p => p.s).map(p => p.s))].sort();
const facultades = [...new Set(DATA.filter(p => p.f).map(p => p.f))].sort();
const availableMonths = [...new Set(DATA.filter(p => p.d).map(p => parseInt(p.d.split('/')[1])))].sort((a,b) => a-b);

function mkBtn(parent, text, onclick) {
  const b = document.createElement('button');
  b.className = 'filter-btn';
  b.textContent = text;
  b.onclick = onclick;
  parent.appendChild(b);
  return b;
}

function buildFilters() {
  const tw = document.getElementById('tipo-filters');
  mkBtn(tw, 'Todos', () => { activeTipo = null; sync(); });
  tipos.forEach(t => { const b = mkBtn(tw, t, () => { activeTipo = activeTipo===t?null:t; sync(); }); b.dataset.tipo = t; });

  const fw = document.getElementById('fac-filters');
  mkBtn(fw, 'Todas', () => { activeFac = null; sync(); });
  facultades.forEach(f => { const b = mkBtn(fw, f, () => { activeFac = activeFac===f?null:f; sync(); }); b.dataset.fac = f; });

  const mw = document.getElementById('month-filters');
  mkBtn(mw, 'Todos', () => { activeMonth = null; sync(); });
  availableMonths.forEach(m => { const b = mkBtn(mw, MONTH_NAMES[m], () => { activeMonth = activeMonth===m?null:m; sync(); }); b.dataset.month = m; });
}

function sync() { updateFilters(); render(); }

function updateFilters() {
  document.querySelectorAll('#tipo-filters .filter-btn').forEach(b => {
    const t = b.dataset.tipo;
    b.className = t===undefined ? (activeTipo===null?'filter-btn active':'filter-btn') : (activeTipo===t?'filter-btn active-tipo':'filter-btn');
  });
  document.querySelectorAll('#fac-filters .filter-btn').forEach(b => {
    const f = b.dataset.fac;
    b.className = f===undefined ? (activeFac===null?'filter-btn active':'filter-btn') : (activeFac===f?'filter-btn active':'filter-btn');
  });
  document.querySelectorAll('#month-filters .filter-btn').forEach(b => {
    const m = b.dataset.month;
    b.className = m===undefined ? (activeMonth===null?'filter-btn active':'filter-btn') : (activeMonth===parseInt(m)?'filter-btn active':'filter-btn');
  });
}

function getFiltered() {
  return DATA.filter(p => {
    if (activeTipo && p.s !== activeTipo) return false;
    if (activeFac && p.f !== activeFac) return false;
    if (activeMonth) { if (!p.d) return false; if (parseInt(p.d.split('/')[1]) !== activeMonth) return false; }
    if (searchTerm && !p.n.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}

function renderCard(p) {
  const cls = p.s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const fc = FAC_COLORS[p.f]||'#999';
  return `<div class="program-card">
    <div class="card-accent ${cls}"></div>
    <div class="card-body">
      <div class="card-meta">
        <span class="card-tipo ${cls}">${p.s}</span>
        <span class="card-date">${formatDate(p.d)}</span>
      </div>
      <div class="card-name">${p.n}</div>
      <div class="card-fac"><span class="fac-dot" style="background:${fc}"></span>${p.f||'Sin facultad'}</div>
    </div>
  </div>`;
}

function render() {
  const filtered = getFiltered();
  const withDate = filtered.filter(p=>p.d).sort((a,b)=>{const da=parseDate(a.d),db=parseDate(b.d);return(da.year*10000+da.month*100+da.day)-(db.year*10000+db.month*100+db.day);});
  const withoutDate = filtered.filter(p=>!p.d);
  const months = {};
  withDate.forEach(p=>{const k=parseDate(p.d).month;if(!months[k])months[k]=[];months[k].push(p);});

  let html = '';
  Object.keys(months).map(Number).sort((a,b)=>a-b).forEach((m,i)=>{
    const progs=months[m];
    html+=`<div class="month-section" style="animation-delay:${i*0.06}s">
      <div class="month-header">
        <span class="month-name">${MONTH_NAMES[m]}</span>
        <span class="month-year">2026</span>
        <span class="month-count">${progs.length} programa${progs.length!==1?'s':''}</span>
      </div>
      <div class="programs-grid">${progs.map(renderCard).join('')}</div>
    </div>`;
  });

  if (withoutDate.length>0 && !activeMonth) {
    html+=`<div class="no-date-section"><div class="no-date-header">Fecha por confirmar</div><div class="programs-grid">${withoutDate.map(renderCard).join('')}</div></div>`;
  }

  if (!filtered.length) {
    html=`<div class="empty-state"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>No se encontraron programas con los filtros seleccionados.</p></div>`;
  }

  document.getElementById('calendar').innerHTML=html;

  const d=filtered.filter(p=>p.s==='Diplomado').length, c=filtered.filter(p=>p.s==='Curso').length, t=filtered.filter(p=>p.s==='Taller').length, pa=filtered.filter(p=>p.s==='Pasantía').length;
  let s=`<div class="stat"><div class="stat-num">${filtered.length}</div><div class="stat-label">Programas</div></div>`;
  if(d) s+=`<div class="stat"><div class="stat-num">${d}</div><div class="stat-label">Diplomados</div></div>`;
  if(c) s+=`<div class="stat"><div class="stat-num">${c}</div><div class="stat-label">Cursos</div></div>`;
  if(t) s+=`<div class="stat"><div class="stat-num">${t}</div><div class="stat-label">Talleres</div></div>`;
  if(pa) s+=`<div class="stat"><div class="stat-num">${pa}</div><div class="stat-label">Pasantías</div></div>`;
  document.getElementById('stats-bar').innerHTML=s;
}

document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase().trim();render();});
window.addEventListener('scroll',()=>{document.getElementById('scrollTop').classList.toggle('visible',window.scrollY>400);});

buildFilters(); updateFilters(); render();
</script>
