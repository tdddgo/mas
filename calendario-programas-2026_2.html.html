":"Negocios y Tecnología","s":"Diplomado","d":"01/09/2026","u":"https://www.uniacc.cl/postgrados-y-educacion-continua/diplomado-en-tributacion-internacional-y-negocios-globales/","m":""},{"i":97,"n":"Curso: Medios, Luz y Tecnologías para Arquitectura Temporal","f":"Arquitectura y Diseño","s":"Curso","d":"28/10/2026","u":"","m":"Diplomado en Arquitectura Temporal"},{"i":98,"n":"Curso: Visual Merchandising y Psicología del Consumidor","f":"Arquitectura y Diseño","s":"Curso","d":"28/09/2026","u":"","m":"Diplomado en Diseño Estratégico de Espacios Comerciales"},{"i":99,"n":"Curso: Interiorismo Comercial y Mobiliario de Exhibición","f":"Arquitectura y Diseño","s":"Curso","d":"28/10/2026","u":"","m":"Diplomado en Diseño Estratégico de Espacios Comerciales"},{"i":100,"n":"Curso de Mezcla Musical Avanzada: técnica, criterio y creatividad","f":"Artes","s":"Curso","d":"13/07/2026","u":"","m":""},{"i":101,"n":"Curso Producción y Síntesis de Audio en Ableton Live","f":"Artes","s":"Curso","d":"23/07/2026","u":"","m":""},{"i":102,"n":"Curso Ley de Responsabilidad Parental y Pago Efectivo de Alimentos (Ley 21.484)","f":"Ciencias Jurídicas y Sociales","s":"Curso","d":"05/08/2026","u":"","m":""},{"i":103,"n":"Curso en Registro Nacional de Deudores de Pensiones de Alimentos","f":"Ciencias Jurídicas y Sociales","s":"Curso","d":"10/08/2026","u":"","m":""},{"i":104,"n":"Curso Arte Contemporáneo y Bienales Internacionales","f":"Artes","s":"Curso","d":"05/10/2026","u":"","m":""},{"i":105,"n":"Diplomado en Danza Espectáculo","f":"Artes","s":"Diplomado","d":"","u":"https://www.uniacc.cl/diplomado-en-danza-espectaculo/","m":""}];
const MN=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FC={'Ciencias Jurídicas y Sociales':'#1A1A1A','Artes':'#E91E8C','Comunicaciones':'#F37021','Psicología':'#5BBEF5','Negocios y Tecnología':'#2A6BAC','Diversidad, Género e Inclusión':'#9B59B6','Arquitectura y Diseño':'#E74C3C'};
const LS_D='mas_dates',LS_U='mas_urls';
function gDO(){try{return JSON.parse(localStorage.getItem(LS_D)||'{}')}catch{return{}}}
function gUO(){try{return JSON.parse(localStorage.getItem(LS_U)||'{}')}catch{return{}}}
function sDO(i,v){const o=gDO();o[i]=v;localStorage.setItem(LS_D,JSON.stringify(o))}
function sUO(i,v){const o=gUO();o[i]=v;localStorage.setItem(LS_U,JSON.stringify(o))}
function gD(p){const o=gDO();return o[p.i]!==undefined?o[p.i]:p.d}
function gU(p){const o=gUO();return o[p.i]!==undefined?o[p.i]:p.u}
function pD(d){if(!d)return null;const[day,m,y]=d.split('/');return{day:+day,month:+m,year:+y}}
function fD(d){if(!d)return'Por confirmar';const p=pD(d);return p.day+' de '+MN[p.month].toLowerCase()}
function cls(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
let selT=new Set(),selF=new Set(),selM=new Set(),sTerm='';
const tipos=[...new Set(D.map(p=>p.s))].sort();
const facs=[...new Set(D.filter(p=>p.f).map(p=>p.f))].sort();
const meses=[...new Set(D.filter(p=>gD(p)).map(p=>+gD(p).split('/')[1]))].sort((a,b)=>a-b);
function mkB(par,txt,fn){const b=document.createElement('button');b.className='fb';b.textContent=txt;b.onclick=fn;par.appendChild(b);return b}
function buildF(){
const tw=document.getElementById('ft');mkB(tw,'Todos',()=>{selT.clear();sync()});
tipos.forEach(t=>{const b=mkB(tw,t,()=>{selT.has(t)?selT.delete(t):selT.add(t);sync()});b.dataset.tipo=t});
const fw=document.getElementById('ff');mkB(fw,'Todas',()=>{selF.clear();sync()});
facs.forEach(f=>{const b=mkB(fw,f,()=>{selF.has(f)?selF.delete(f):selF.add(f);sync()});b.dataset.fac=f});
const mw=document.getElementById('fm');mkB(mw,'Todos',()=>{selM.clear();sync()});
meses.forEach(m=>{const b=mkB(mw,MN[m],()=>{selM.has(m)?selM.delete(m):selM.add(m);sync()});b.dataset.mes=m});
}
function sync(){uF();render();uP()}
function uF(){
document.querySelectorAll('#ft .fb').forEach(b=>{const t=b.dataset.tipo;b.className=!t?(selT.size===0?'fb on':'fb'):(selT.has(t)?'fb on-'+t:'fb')});
document.querySelectorAll('#ff .fb').forEach(b=>{const f=b.dataset.fac;b.className=!f?(selF.size===0?'fb on':'fb'):(selF.has(f)?'fb on':'fb')});
document.querySelectorAll('#fm .fb').forEach(b=>{const m=b.dataset.mes;b.className=!m?(selM.size===0?'fb on':'fb'):(selM.has(+m)?'fb on':'fb')});
}
function getF(){
return D.filter(p=>{
if(selT.size&&!selT.has(p.s))return false;
if(selF.size&&!selF.has(p.f))return false;
if(selM.size){const d=gD(p);if(!d)return false;if(!selM.has(+d.split('/')[1]))return false}
if(sTerm&&!p.n.toLowerCase().includes(sTerm))return false;
return true;
});
}
function cH(p){
const c=cls(p.s),fc=FC[p.f]||'#999',d=gD(p),u=gU(p);
const madre=p.m?'<span class="cmadre" title="'+p.m+'">articulado a '+p.m+'</span>':'';
const uBtn=u?'<a href="'+u+'" target="_blank" class="bv act">Ver programa</a>':'<span class="bv ina">Sin web activa</span>';
return '<div class="pc"><div class="ca '+c+'"></div><div class="cb"><div class="cm"><span class="ct '+c+'">'+p.s+'</span>'+madre+'<span class="cd" onclick="oD('+p.i+')">'+fD(d)+'</span></div><div class="cn">'+p.n+'</div><div class="cf"><span class="fd" style="background:'+fc+'"></span>'+p.f+'</div><div class="actions">'+uBtn+'<button class="bedit" onclick="oU('+p.i+')">✎ Web</button></div></div></div>';
}
function render(){
const fl=getF();
const wd=fl.filter(p=>gD(p)).sort((a,b)=>{const da=pD(gD(a)),db=pD(gD(b));return(da.year*1e4+da.month*100+da.day)-(db.year*1e4+db.month*100+db.day)});
const nd=fl.filter(p=>!gD(p));
const mo={};wd.forEach(p=>{const k=pD(gD(p)).month;if(!mo[k])mo[k]=[];mo[k].push(p)});
let h='';
Object.keys(mo).map(Number).sort((a,b)=>a-b).forEach((m,i)=>{const pr=mo[m];
h+='<div class="ms" style="animation-delay:'+i*.05+'s"><div class="mh"><span class="mn">'+MN[m]+'</span><span class="my">2026</span><span class="mc">'+pr.length+' programa'+(pr.length!==1?'s':'')+'</span></div><div class="pg">'+pr.map(cH).join('')+'</div></div>';});
if(nd.length&&!selM.size)h+='<div class="nds"><div class="ndh">Fecha por confirmar</div><div class="pg">'+nd.map(cH).join('')+'</div></div>';
if(!fl.length)h='<div class="es"><p>No se encontraron programas con los filtros seleccionados.</p></div>';
document.getElementById('cal').innerHTML=h;
const di=fl.filter(p=>p.s==='Diplomado').length,cu=fl.filter(p=>p.s==='Curso').length,ta=fl.filter(p=>p.s==='Taller').length,pa=fl.filter(p=>p.s==='Pasantía').length;
let s='<div><div class="sn">'+fl.length+'</div><div class="sl">Programas</div></div>';
if(di)s+='<div><div class="sn">'+di+'</div><div class="sl">Diplomados</div></div>';
if(cu)s+='<div><div class="sn">'+cu+'</div><div class="sl">Cursos</div></div>';
if(ta)s+='<div><div class="sn">'+ta+'</div><div class="sl">Talleres</div></div>';
if(pa)s+='<div><div class="sn">'+pa+'</div><div class="sl">Pasantías</div></div>';
document.getElementById('stats').innerHTML=s;
}
function uP(){
const nw=D.filter(p=>!gU(p));
document.getElementById('panelBtn').textContent='Programas sin web activa ('+nw.length+')';
let h='';nw.forEach(p=>{h+='<div class="panel-item"><span class="pi-name">'+p.n+'</span><span class="pi-fac">'+p.f+'</span><button class="bedit" onclick="oU('+p.i+')">+ URL</button></div>'});
document.getElementById('panelList').innerHTML=h;
}
function togglePanel(){document.getElementById('panel').classList.toggle('show');document.getElementById('panelBtn').classList.toggle('open')}
let eIdx=-1,eMode='';
function oD(i){eIdx=i;eMode='date';const p=D.find(x=>x.i===i);document.getElementById('mTitle').textContent='Editar fecha';document.getElementById('mName').textContent=p.n;document.getElementById('mLabel').textContent='Fecha de inicio (DD/MM/AAAA)';document.getElementById('mInput').value=gD(p);document.getElementById('mo').classList.add('show');document.getElementById('mInput').focus()}
function oU(i){eIdx=i;eMode='url';const p=D.find(x=>x.i===i);document.getElementById('mTitle').textContent='Editar URL';document.getElementById('mName').textContent=p.n;document.getElementById('mLabel').textContent='URL de la landing page';document.getElementById('mInput').value=gU(p);document.getElementById('mo').classList.add('show');document.getElementById('mInput').focus()}
function closeM(){document.getElementById('mo').classList.remove('show');eIdx=-1}
function saveM(){const v=document.getElementById('mInput').value.trim();if(eMode==='date')sDO(eIdx,v);else sUO(eIdx,v);closeM();sync()}
document.getElementById('mInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveM()});
document.getElementById('mo').addEventListener('click',e=>{if(e.target.id==='mo')closeM()});
document.getElementById('search').addEventListener('input',e=>{sTerm=e.target.value.toLowerCase().trim();render()});
window.addEventListener('scroll',()=>{document.getElementById('st').classList.toggle('visible',window.scrollY>300)});
buildF();uF();render();uP();
</script>
</body>
</html>
